<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мій Розклад</title>
    <link rel="icon" type="image/svg+xml" href="images/icons/kitty.jpg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  </head>
  <body>
    <div class="theme-switch-wrapper">
      <label class="theme-switch" for="checkbox">
        <input type="checkbox" id="checkbox" />
        <div class="slider round">
          <img src="images/icons/sun.svg" class="icon sun" alt="Sun" />
          <img src="images/icons/moon.svg" class="icon moon" alt="Moon" />
        </div>
      </label>
    </div>

    <div class="container">
      <div
        class="time-tracker-container"
        id="timeTracker"
        style="display: none"
      >
        <div id="tracker-text" class="tracker-text">Завантаження...</div>
        <div class="progress-wrapper" id="progress-wrapper">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <div class="week-status" id="weekStatus">Завантаження...</div>

      <div class="tabs-nav">
        <button class="tab-btn" id="btn-upper" data-tab="upper">Верхній</button>
        <button class="tab-btn active" id="btn-lower" data-tab="lower">
          Нижній
        </button>
      </div>

      <div id="upper" class="tab-content"></div>
      <div id="lower" class="tab-content active"></div>
    </div>

    <button class="find-me-btn" id="findMeBtn">📍 Де я?</button>

    <button id="editModeBtn" class="edit-mode-btn">✏️</button>

    <button id="adminBtn" class="admin-btn">➕</button>

    <div id="adminModal" class="modal">
      <div class="modal-content">
        <h3>Додати новий запис</h3>
        <form id="editForm">
          <select id="editWeek">
            <option value="upper">Верхній тиждень</option>
            <option value="lower">Нижній тиждень</option>
          </select>
          <select id="editDay">
            <option>Понеділок</option>
            <option>Вівторок</option>
            <option>Середа</option>
            <option>Четвер</option>
            <option>П'ятниця</option>
            <option>Субота</option>
            <option>Неділя</option>
          </select>
          <input
            type="text"
            id="editSubject"
            placeholder="Назва предмета"
            required
          />
          <input
            type="text"
            id="editTime"
            placeholder="Час (напр. 14:00-15:30)"
            required
          />
          <select id="editType">
            <option value="ind">Індивідуальне (Інд)</option>
            <option value="pr">Практика (Пара)</option>
            <option value="lek">Лекція (Пара)</option>
          </select>
          <input
            type="text"
            id="editTeacher"
            placeholder="Викладач / Ім'я учня"
          />
          <input
            type="text"
            id="editLink"
            placeholder="Посилання (Zoom/Meet)"
          />

          <div class="modal-btns">
            <button type="submit" class="save-btn">Зберегти</button>
            <button type="button" id="closeModal" class="cancel-btn">
              Закрити
            </button>
          </div>
        </form>
      </div>
    </div>

    <div id="deleteModal" class="modal">
      <div class="modal-content">
        <h3>🗑 Видалити урок?</h3>
        <p id="deleteConfirmText">Ви впевнені?</p>
        <div class="modal-btns">
          <button id="confirmDeleteBtn" class="delete-confirm-btn">
            Видалити
          </button>
          <button id="cancelDeleteBtn" class="cancel-btn">Скасувати</button>
        </div>
      </div>
    </div>

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
    </script><script src="script.js"></script>
  </body>
</html>
